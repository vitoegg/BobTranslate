name: Release BobTranslate

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "main.js"
      - "scripts/**"
      - ".github/workflows/release-bobplugin.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-bobplugin
  cancel-in-progress: false

jobs:
  release-bobplugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Publish plugins
        id: release
        run: node scripts/release.js
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Clean releases and workflow runs
        if: always()
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{ github.token }}
          delete_releases: ${{ steps.release.outputs.tag != '' }}
          delete_tags: ${{ steps.release.outputs.tag != '' }}
          # 保留已校验的目标，不依赖其他 Release 的日期排序。
          releases_keep_keyword: ${{ steps.release.outputs.tag }}
          releases_keep_latest: 0
          delete_workflows: true
          workflows_keep_day: 0

      - name: Verify retained release
        if: ${{ !cancelled() && steps.release.outputs.tag != '' }}
        run: node scripts/release.js --verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
